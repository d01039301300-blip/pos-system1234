<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>طلبات التوصيل</title><style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#eef2f7;margin:0;padding:14px;color:#0f172a}.card{max-width:620px;margin:14px auto;background:white;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0f172a18}h1{font-size:21px}.info{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;line-height:1.9}button{padding:11px 16px;border:0;border-radius:10px;background:#047857;color:white;font-weight:800}.secondary{background:#1d4ed8}canvas{width:100%;height:150px;border:1px dashed #64748b;border-radius:10px;touch-action:none}.row{margin:14px 0}input{padding:10px;width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px}    :root{--e1-scale:1.3}body{font-family:'Reem Kufi Ink',sans-serif;line-height:1.5}body[data-font-size="normal"]{--e1-scale:1}body[data-font-size="xlarge"]{--e1-scale:1.6}body :where(h1,h2,h3,button,input,select,textarea,table,th,td,p,span,a){font-family:'Reem Kufi Ink',sans-serif;font-size:max(13px,calc(14px * var(--e1-scale)));line-height:1.5}</style></head><body><main class="card"><h1>واجهة الطيار</h1><div class="info" id="details">جارٍ تحميل الطلب…</div><div class="row"><a id="call" hidden>اتصال بالعميل</a></div><div class="row"><button class="secondary" onclick="update('dispatched')">بدء التوصيل</button></div><div class="row"><label>المبلغ المحصل عند التسليم<input id="cash" type="number" min="0" step="0.01" value="0"></label></div><div class="row"><label>توقيع العميل عند الاستلام<canvas id="signature" width="560" height="150"></canvas></label><button type="button" class="secondary" onclick="clearSignature()">مسح التوقيع</button></div><button onclick="update('delivered')">تأكيد التسليم</button><p id="status" role="status"></p></main><script>const token=location.pathname.split('/').filter(Boolean).pop(),canvas=document.getElementById('signature'),ctx=canvas.getContext('2d');let drawing=false,hasInk=false;function pos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#0f172a';ctx.lineTo(p.x,p.y);ctx.stroke();hasInk=true});canvas.addEventListener('pointerup',()=>drawing=false);function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false}async function load(){try{const r=await fetch(`/delivery/rider/${encodeURIComponent(token)}/data`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('details').textContent=`طلب ${d.invoice_number} · العميل ${d.customer_name||'—'} · المتبقي ${Number(d.due_amount||0).toFixed(2)} ج.م · الحالة ${d.status}`;const a=document.getElementById('call');if(d.customer_phone){a.href=`tel:${d.customer_phone}`;a.hidden=false}}catch(e){document.getElementById('details').textContent=e.message}}async function update(status){const msg=document.getElementById('status');if(status==='delivered'&&!hasInk)return msg.textContent='يجب تسجيل توقيع العميل قبل تأكيد التسليم.';msg.textContent='جارٍ حفظ الحالة…';try{const r=await fetch(`/delivery/rider/${encodeURIComponent(token)}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,cash_collected:Number(document.getElementById('cash').value||0),signature:status==='delivered'?canvas.toDataURL('image/png'):''})});const d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent=d.message;await load()}catch(e){msg.textContent=e.message}}load();</script></body></html>
