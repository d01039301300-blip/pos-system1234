<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>System POS — الترخيص</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a;
         color: #e2e8f0; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #1e293b; border-radius: 12px; padding: 32px;
          max-width: 560px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  h1 { margin: 0 0 8px; font-size: 22px; }
  h2 { margin: 24px 0 12px; font-size: 16px; color: #94a3b8; font-weight: 400; }
  .status { padding: 16px; border-radius: 8px; margin: 16px 0; }
  .trial { background: #164e63; color: #67e8f9; }
  .expired { background: #7f1d1d; color: #fecaca; }
  .licensed { background: #14532d; color: #86efac; }
  .error { background: #7c2d12; color: #fdba74; }
  .device-id { background: #0f172a; padding: 12px; border-radius: 6px;
               font-family: monospace; font-size: 11px; word-break: break-all;
               border: 1px solid #334155; margin: 8px 0; user-select: all; }
  button { background: #3b82f6; color: white; border: 0; border-radius: 6px;
           padding: 10px 20px; font-size: 14px; cursor: pointer; margin-left: 8px; }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  button.danger { background: #dc2626; }
  textarea { width: 100%; padding: 10px; border-radius: 6px;
             border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
             font-family: monospace; font-size: 11px; min-height: 100px;
             box-sizing: border-box; }
  .muted { color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">System POS</h1>
  <h2 id="subtitle">جارٍ التحقق من الترخيص...</h2>
  <div id="statusBox" class="status trial" style="display:none;"></div>

  <div id="trialInfo" style="display:none;">
    <h2>معلومات الجهاز</h2>
    <div class="muted">أرسل هذا الكود إلى المالك للتفعيل:</div>
    <div class="device-id" id="deviceId">—</div>
    <button id="copyBtn">نسخ الكود</button>
  </div>

  <div id="activationSection" style="display:none;">
    <h2>تفعيل الترخيص</h2>
    <div class="muted">الصق ملف الترخيص (المحتوى كامل) أو مساره:</div>
    <textarea id="licenseInput" placeholder='{"v":1,"fp":{...},"sig":"..."}'></textarea>
    <div style="margin-top:12px;">
      <button id="activateBtn">تفعيل</button>
    </div>
    <div id="activationMsg" class="muted" style="margin-top:8px;"></div>
  </div>

  <div style="margin-top:24px; text-align:left;">
    <button id="quitBtn" class="danger">خروج</button>
  </div>
</div>
<script src="license-gate-renderer.js"></script>
</body>
</html>
