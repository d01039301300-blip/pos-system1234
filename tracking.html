<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تتبع الطلب</title><style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#eef2f7;margin:0;padding:16px;color:#0f172a}.card{max-width:560px;margin:28px auto;background:white;border-radius:18px;padding:22px;box-shadow:0 8px 24px #0f172a18}h1{text-align:center}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:25px 0}.step{padding:12px 6px;border-radius:12px;background:#e2e8f0;text-align:center;font-size:13px;font-weight:800}.step.active{background:#0f766e;color:white}.muted{text-align:center;color:#64748b;font-size:13px}    :root{--e1-scale:1.3}body{font-family:'Reem Kufi Ink',sans-serif;line-height:1.5}body[data-font-size="normal"]{--e1-scale:1}body[data-font-size="xlarge"]{--e1-scale:1.6}body :where(h1,h2,h3,button,input,select,textarea,table,th,td,p,span,a){font-family:'Reem Kufi Ink',sans-serif;font-size:max(13px,calc(14px * var(--e1-scale)));line-height:1.5}</style></head><body><main class="card"><h1 id="business">تتبع طلبك</h1><p class="muted">رقم الطلب: <b id="number">—</b></p><div class="steps"><div class="step" data-status="assigned">قيد التحضير</div><div class="step" data-status="dispatched">في الطريق</div><div class="step" data-status="delivered">تم التسليم</div></div><p class="muted" id="updated">جارٍ تحميل الحالة…</p></main><script>const token=location.pathname.split('/').filter(Boolean).pop();async function refresh(){try{const r=await fetch(`/delivery/track/${encodeURIComponent(token)}/data`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('business').textContent=d.business?.business_name||'تتبع طلبك';document.getElementById('number').textContent=d.invoice_number;const rank={assigned:0,dispatched:1,delivered:2};document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',rank[x.dataset.status]<=rank[d.status]));document.getElementById('updated').textContent=`الحالة: ${{assigned:'قيد التحضير',dispatched:'في الطريق',delivered:'تم التسليم',cancelled:'أُلغي الطلب'}[d.status]||d.status} · آخر تحديث ${d.updated_at||''}`}catch(e){document.getElementById('updated').textContent=e.message}}refresh();setInterval(refresh,20000);</script></body></html>
