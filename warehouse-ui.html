<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخازن المتقدمة</title>
    <style>
        :root {
            --bg-dark: #090a0f; --card-bg: #121623; --text-main: #f8fafc; --text-muted: #94a3b8;
            --accent: #00e5ff; --accent-hover: #059669; --border: #334155;
            --blue: #3b82f6; --blue-hover: #2563eb; --danger: #ef4444;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 30px; min-height: 100vh; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px;}
        .page-header h1 { margin: 0; font-size: 26px; color: var(--accent); }

        /* الشاشة الرئيسية (كروت المخازن) */
        .warehouses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .warehouse-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .card-stats { display: flex; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-muted); }
        .btn-enter { background-color: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }

        /* شاشة عرض تفاصيل المخزن (الجدول) */
        .view-section { display: none; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
        .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-add-new { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-size: 14px; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 18px; padding: 5px; transition: 0.2s; }
        .btn-delete { color: var(--danger); }

        /* النافذة المنبثقة */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; padding: 25px; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .form-group select, .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: white; }
        
        .toggle-new-prod { display: block; text-align: left; margin-bottom: 15px; font-size: 13px; color: var(--blue); cursor: pointer; text-decoration: underline; }
        
        .radio-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .radio-card { flex: 1; border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; }
        .radio-card.active { border-color: var(--accent); background: rgba(16,185,129,0.1); color: var(--accent); }
        
        .hidden { display: none; }
        .btn-save { background-color: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <!-- 1. الشاشة الرئيسية -->
    <div id="main-view">
        <div class="page-header"><h1>إدارة المخازن</h1></div>
        <div class="warehouses-grid" id="warehouses-container"></div>
    </div>

    <!-- 2. شاشة تفاصيل المخزن (الجدول) -->
    <div id="details-view" class="view-section">
        <div class="view-header">
            <button class="btn-back" onclick="goBack()">&rarr; رجوع للمخازن</button>
            <h2 id="details-title" style="margin:0;">اسم المخزن</h2>
            <button class="btn-add-new" onclick="openAddModal()">+ إضافة صنف جديد</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>اسم الصنف</th>
                    <th>الكمية الحالية</th>
                    <th>سعر التكلفة</th>
                    <th>إجمالي القيمة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="inventory-table-body"></tbody>
        </table>
    </div>

    <!-- 3. نافذة الإضافة -->
    <div class="modal-overlay" id="add-product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة / تفعيل صنف</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <!-- اختيار من الأصناف الموجودة -->
            <div id="existing-product-section">
                <div class="form-group">
                    <label>اختر الصنف من القائمة:</label>
                    <select id="modal-prod-select"></select>
                </div>
                <span class="toggle-new-prod" onclick="toggleNewProduct()">+ الصنف غير موجود؟ أضفه كصنف جديد</span>
            </div>

            <!-- إضافة صنف جديد -->
            <div id="new-product-section" class="hidden">
                <div class="form-group">
                    <label>اسم الصنف الجديد:</label>
                    <input type="text" id="new-prod-name" placeholder="اكتب اسم الصنف...">
                </div>
                <div class="form-group">
                    <label>الفئة:</label>
                    <select id="new-prod-cat"><option value="">اختر الفئة...</option></select>
                </div>
                <span class="toggle-new-prod" onclick="toggleNewProduct()">&larr; العودة لاختيار صنف موجود</span>
            </div>

            <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">

            <div class="radio-group">
                <div class="radio-card active" id="lbl-activate" onclick="setAction('activate')">تفعيل فقط (كمية 0)</div>
                <div class="radio-card" id="lbl-opening" onclick="setAction('opening')">رصيد افتتاحي (بكمية)</div>
            </div>

            <div id="opening-stock-fields" class="hidden">
                <div class="form-group">
                    <label>الكمية:</label>
                    <input type="number" id="modal-qty" min="1">
                </div>
                <div class="form-group">
                    <label>سعر التكلفة (جنيه):</label>
                    <input type="number" id="modal-cost" min="0" step="0.01">
                </div>
            </div>

            <button class="btn-save" onclick="saveProduct()">حفظ</button>
        </div>
    </div>

<p id="warehouse-status" role="status" aria-live="polite" style="margin:12px 0 0;color:var(--text-muted);"></p>
<script>
    let warehouses = [];
    let products = [];
    let categories = [];
    let currentWhId = null;
    let currentAction = 'activate';
    let isNewProductMode = false;

    const statusEl = () => document.getElementById('warehouse-status');
    const notify = (message, isError = false) => {
        const el = statusEl();
        if (el) { el.textContent = message; el.style.color = isError ? 'var(--danger)' : 'var(--accent)'; }
    };
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
    const money = value => number(value).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    async function api(url, options) {
        const headers = new Headers(options?.headers || {});
        const activeBranchId = localStorage.getItem('system_active_branch_id');
        if (activeBranchId) headers.set('X-Active-Branch', activeBranchId);
        const response = await fetch(url, { ...(options || {}), headers });
        const raw = await response.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch (_) { data = { error: raw || 'استجابة غير صالحة من الخادم.' }; }
        if (!response.ok) throw new Error(data.error || `تعذر تنفيذ الطلب (${response.status}).`);
        return data;
    }

    async function loadSourceData() {
        const [warehouseData, productData, categoryData] = await Promise.all([
            api('/api/warehouses?include_inactive=1'),
            api('/api/products'),
            api('/api/categories')
        ]);
        warehouses = (warehouseData.warehouses || []).map(row => ({ ...row, items: [] }));
        products = Array.isArray(productData) ? productData : productData.products || [];
        categories = Array.isArray(categoryData) ? categoryData : categoryData.categories || [];
        await Promise.all(warehouses.map(async warehouse => {
            try {
                const rows = await api(`/api/warehouse-inventory?warehouse_id=${encodeURIComponent(warehouse.id)}`);
                warehouse.items = (Array.isArray(rows) ? rows : rows.items || []).map(row => {
                    const product = row.product || products.find(item => Number(item.id) === Number(row.product_id));
                    const cost = number(product?.cost_price ?? product?.purchase_price ?? product?.cost);
                    return { ...row, id: row.id || `${warehouse.id}:${row.product_id}`, name: product?.name || `صنف #${row.product_id}`, qty: number(row.quantity), cost };
                });
            } catch (error) {
                warehouse.items = [];
                notify(`تعذر تحميل مخزون ${warehouse.name}: ${error.message}`, true);
            }
        }));
    }

    function renderWarehouses() {
        const html = warehouses.map(wh => {
            const totalQty = wh.items.reduce((sum, item) => sum + number(item.qty), 0);
            const totalValue = wh.items.reduce((sum, item) => sum + number(item.qty) * number(item.cost), 0);
            return `<div class="warehouse-card">
                <h3 style="margin:0;color:var(--text-main);">${escapeHtml(wh.name)}</h3>
                <div class="card-stats">
                    <div class="stat-item"><div class="stat-value">${money(totalQty)}</div><div class="stat-label">إجمالي القطع</div></div>
                    <div class="stat-item"><div class="stat-value">${money(totalValue)}</div><div class="stat-label">قيمة المخزون (ج.م)</div></div>
                </div>
                <button class="btn-enter" onclick="enterWarehouse(${Number(wh.id)})">دخول للمخزن &larr;</button>
            </div>`;
        }).join('');
        document.getElementById('warehouses-container').innerHTML = html || '<p style="color:var(--text-muted);">لا توجد مخازن مرتبطة بالفرع الحالي.</p>';
    }

    async function refreshData() {
        try { await loadSourceData(); renderWarehouses(); notify('تم تحديث المخازن من قاعدة البيانات.'); }
        catch (error) { renderWarehouses(); notify(error.message, true); }
    }

    function enterWarehouse(whId) {
        currentWhId = Number(whId);
        const wh = warehouses.find(row => Number(row.id) === currentWhId);
        if (!wh) return notify('المخزن غير موجود.', true);
        document.getElementById('details-title').innerText = wh.name;
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
        renderTable();
    }

    function renderTable() {
        const wh = warehouses.find(row => Number(row.id) === currentWhId);
        const tbody = document.getElementById('inventory-table-body');
        if (!tbody || !wh) return;
        tbody.innerHTML = wh.items.length ? wh.items.map(item => `<tr>
            <td style="font-weight:bold;">${escapeHtml(item.name)}</td>
            <td><span style="background:rgba(59,130,246,0.2);color:#3b82f6;padding:4px 8px;border-radius:4px;">${money(item.qty)}</span></td>
            <td>${money(item.cost)} ج.م</td>
            <td style="color:var(--accent);font-weight:bold;">${money(number(item.qty) * number(item.cost))} ج.م</td>
            <td><button class="btn-icon btn-delete" type="button" onclick="deleteItem(${Number(item.id)})" title="حذف الربط">&times;</button></td>
        </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">لا توجد أصناف مرتبطة بهذا المخزن.</td></tr>';
    }

    function goBack() {
        document.getElementById('details-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        void refreshData();
    }

    async function openAddModal() {
        try { await loadSourceData(); } catch (error) { notify(error.message, true); return; }
        document.getElementById('modal-prod-select').innerHTML = '<option value="">اختر الصنف...</option>' + products.map(product => `<option value="${Number(product.id)}">${escapeHtml(product.name)}${product.barcode ? ` — ${escapeHtml(product.barcode)}` : ''}</option>`).join('');
        document.getElementById('new-prod-cat').innerHTML = '<option value="">اختر الفئة...</option>' + categories.map(category => `<option value="${Number(category.id)}">${escapeHtml(category.name)}</option>`).join('');
        isNewProductMode = false;
        toggleNewProduct(true);
        setAction('activate');
        document.getElementById('add-product-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('add-product-modal').style.display = 'none'; }

    function toggleNewProduct(forceExisting = false) {
        if (forceExisting) isNewProductMode = false; else isNewProductMode = !isNewProductMode;
        document.getElementById('existing-product-section').style.display = isNewProductMode ? 'none' : 'block';
        document.getElementById('new-product-section').style.display = isNewProductMode ? 'block' : 'none';
        if (isNewProductMode) { document.getElementById('new-prod-name').value = ''; document.getElementById('new-prod-cat').value = ''; }
    }

    function setAction(type) {
        currentAction = type;
        document.getElementById('lbl-activate').classList.toggle('active', type === 'activate');
        document.getElementById('lbl-opening').classList.toggle('active', type === 'opening');
        document.getElementById('opening-stock-fields').className = type === 'opening' ? '' : 'hidden';
    }

    async function saveProduct() {
        if (!currentWhId) return notify('اختر مخزنًا أولاً.', true);
        const qty = currentAction === 'opening' ? number(document.getElementById('modal-qty').value) : 0;
        const cost = currentAction === 'opening' ? number(document.getElementById('modal-cost').value) : 0;
        if (currentAction === 'opening' && (qty <= 0 || cost < 0)) return notify('أدخل كمية وتكلفة صحيحتين.', true);
        try {
            let productId;
            let product;
            if (isNewProductMode) {
                const name = document.getElementById('new-prod-name').value.trim();
                const categoryId = Number(document.getElementById('new-prod-cat').value) || 1;
                if (!name) return notify('اكتب اسم الصنف الجديد.', true);
                const created = await api('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ name, category_id:categoryId, cost_price:cost, sale_price:cost, quantity:0, min_stock:0, unit:'قطعة' }) });
                product = created.product || created;
                productId = Number(product.id);
            } else {
                productId = Number(document.getElementById('modal-prod-select').value);
                product = products.find(item => Number(item.id) === productId);
                if (!productId || !product) return notify('اختر صنفًا من القائمة.', true);
            }
            await api('/api/warehouse-products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ warehouse_id:currentWhId, product_id:productId, category_id:null, quantity:qty, cost_price:cost || number(product.cost_price) }) });
            closeModal();
            await refreshData();
            const stillOpen = warehouses.find(row => Number(row.id) === currentWhId);
            if (stillOpen) { document.getElementById('details-title').innerText = stillOpen.name; renderTable(); document.getElementById('main-view').style.display = 'none'; document.getElementById('details-view').style.display = 'block'; }
            notify('تم حفظ الصنف وربطه بالمخزن من قاعدة البيانات.');
        } catch (error) { notify(error.message, true); }
    }

    async function deleteItem(itemId) {
        notify('حذف الربط يحتاج مسار حذف مخصصًا في الخادم، ولم يتم تنفيذ حذف وهمي.', true);
    }

    window.addEventListener('load', refreshData);
</script>
</body>
</html>
